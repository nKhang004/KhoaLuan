<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ngân Hàng Câu Hỏi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <h2>📚 Ngân Hàng Câu Hỏi</h2>
      <small>Hệ thống quản lý thi trực tuyến</small>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-user">
      <div class="user-avatar" id="avatar-letter">A</div>
      <div class="user-info">
        <strong id="display-name">...</strong>
        <span id="display-role">...</span>
      </div>
      <button class="btn-logout" title="Đăng xuất" onclick="logout()">⏻</button>
    </div>
  </aside>
  <div class="main-content">
    <div class="topbar">
      <div>
        <h1 id="page-title">Tổng quan</h1>
        <div class="breadcrumb" id="page-breadcrumb">Trang chủ</div>
      </div>
    </div>
    <div class="page-body" id="page-body">
      <div class="loading"><div class="spinner"></div> Đang tải...</div>
    </div>
  </div>
</div>

<script src="api.js"></script>
<script src="app.js"></script>
<script>
  (async function() {
    const token = sessionStorage.getItem('access_token');
    console.log('Index page: token =', token);
    if (!token) {
      console.log('No token, redirect to login');
      window.location.replace('login.html');
      return;
    }
    try {
      const user = await getMe();
      console.log('User valid:', user);
      // Nếu thành công, không làm gì thêm, app.js sẽ chạy
    } catch(e) {
      console.error('Token invalid:', e);
      sessionStorage.clear();
      window.location.replace('login.html');
    }
  })();
</script>
</body>
</html>
