<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập – Ngân Hàng Câu Hỏi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="logo">
      <h1>📚 Ngân Hàng Câu Hỏi</h1>
      <p>Hệ thống quản lý câu hỏi & thi trực tuyến</p>
    </div>
    <div id="login-alert"></div>
    <div class="form-group">
      <label>Tên đăng nhập</label>
      <input type="text" id="login-username" placeholder="Nhập tên đăng nhập" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Mật khẩu</label>
      <input type="password" id="login-password" placeholder="Nhập mật khẩu" autocomplete="current-password">
    </div>
    <button class="btn btn-primary btn-full" id="btn-login" onclick="doLogin()">Đăng nhập</button>
    <p class="text-muted text-center mt-10" style="font-size:12px">
      Tài khoản mẫu: <strong>admin / 123456</strong>
    </p>
  </div>
</div>

<!-- Modal đổi mật khẩu lần đầu -->
<div id="change-pwd-modal" class="modal-overlay" style="display:none">
  <div class="modal" style="max-width:450px">
    <div class="modal-header">
      <h3>🔐 Đổi mật khẩu lần đầu</h3>
      <button class="btn-close" onclick="closeChangePwdModal()">×</button>
    </div>
    <div class="modal-body">
      <div id="cp-alert"></div>
      <div class="form-group">
        <label>Tên đăng nhập</label>
        <input type="text" id="cp-username" readonly style="background:#f0f4f8">
      </div>
      <div class="form-group">
        <label>Mật khẩu cũ (ngày sinh dạng ddmmyyyy)</label>
        <input type="password" id="cp-old" placeholder="VD: 15032004">
      </div>
      <div class="form-group">
        <label>Mật khẩu mới</label>
        <input type="password" id="cp-new" placeholder="Ít nhất 6 ký tự">
      </div>
      <div class="form-group">
        <label>Xác nhận mật khẩu mới</label>
        <input type="password" id="cp-confirm">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeChangePwdModal()">Hủy</button>
      <button class="btn btn-primary" onclick="doChangeFirstPassword()">Đổi mật khẩu</button>
    </div>
  </div>
</div>

<script src="api.js"></script>
<script>
sessionStorage.clear();

let pendingUsername = '';

function showAlert(id, msg, type='error') {
  const el = document.getElementById(id);
  if (el) el.innerHTML = `<div class="alert alert-${type}">${type==='error'?'⚠️':'✅'} ${msg}</div>`;
}
function clearAlert(id) {
  const el = document.getElementById(id);
  if (el) el.innerHTML = '';
}

async function doLogin() {
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  if (!username || !password) return showAlert('login-alert','Vui lòng nhập đầy đủ thông tin');

  const btn = document.getElementById('btn-login');
  btn.disabled = true; btn.textContent = 'Đang đăng nhập...';
  clearAlert('login-alert');

  try {
    const data = await login(username, password);
    sessionStorage.setItem('access_token', data.access_token);
    const me = await getMe();
    sessionStorage.setItem('user_info', JSON.stringify(me));
    window.location.href = 'index.html';
  } catch(err) {
    // Kiểm tra nội dung lỗi có yêu cầu đổi mật khẩu lần đầu
    if (err.message && err.message.includes('đổi mật khẩu lần đầu')) {
      pendingUsername = username;
      document.getElementById('cp-username').value = username;
      document.getElementById('change-pwd-modal').style.display = 'flex';
      btn.disabled = false;
      btn.textContent = 'Đăng nhập';
      return;
    }
    showAlert('login-alert', err.message);
    btn.disabled = false;
    btn.textContent = 'Đăng nhập';
  }
}

async function doChangeFirstPassword() {
  const oldPwd = document.getElementById('cp-old').value;
  const newPwd = document.getElementById('cp-new').value;
  const confirmPwd = document.getElementById('cp-confirm').value;

  if (!oldPwd || !newPwd) {
    return showAlert('cp-alert', 'Vui lòng nhập đầy đủ thông tin');
  }
  if (newPwd.length < 6) {
    return showAlert('cp-alert', 'Mật khẩu mới phải có ít nhất 6 ký tự');
  }
  if (newPwd !== confirmPwd) {
    return showAlert('cp-alert', 'Mật khẩu xác nhận không khớp');
  }

  try {
    await changeFirstPassword(pendingUsername, oldPwd, newPwd);
    showAlert('cp-alert', 'Đổi mật khẩu thành công! Vui lòng đăng nhập lại.', 'success');
    setTimeout(() => {
      closeChangePwdModal();
      document.getElementById('login-password').value = '';
      document.getElementById('login-username').value = pendingUsername;
      pendingUsername = '';
    }, 1500);
  } catch(err) {
    showAlert('cp-alert', err.message);
  }
}

function closeChangePwdModal() {
  document.getElementById('change-pwd-modal').style.display = 'none';
  document.getElementById('cp-old').value = '';
  document.getElementById('cp-new').value = '';
  document.getElementById('cp-confirm').value = '';
  clearAlert('cp-alert');
}

document.addEventListener('keypress', e => {
  if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
